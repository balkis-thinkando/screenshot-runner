# Monthly screenshot check: one product per day during the first week of each month
# (schedule.json maps day of month -> product tag). Results go to Supabase (recipe_runs) and the
# job summary. The job fails, and GitHub emails you, when a screenshot is blocked (usually an
# expired sign-in), a script could not reach its screen, or nothing ran. Other needs_review results
# do not fail the job.
#
# Run it by hand: Actions > Monthly screenshot check > Run workflow. Tick "update_baselines" to save
# today's captures as the new Linux baselines (only after reviewing them; it commits to main).
#
# After the check, scripts/ai-review.mjs has Claude compare each flagged capture with the lesson image and
# creates a SHOT work item (label ai-reviewed) when a new screenshot is needed. Tick "ai_dry_run" to see
# the AI verdicts without updating Supabase or creating tickets.
#
# When a screenshot still cannot be captured (screen not reached and not repaired, blocked for a reason other
# than an expired sign-in, or the test crashed or timed out), scripts/manual-tickets.mjs creates a SHOT work
# item (label manual-capture) asking for it to be captured by hand, with the recipe's steps. "ai_dry_run" covers
# it too.
#
# When a script cannot reach its screen, scripts/ai-repair.mjs has Claude fix the script and tests it on the
# test site (3 attempts per script, 5 scripts per run). A working fix is reviewed like any capture, creates a
# SHOT work item (label ai-repaired) when needed and is opened as a pull request for you to review; it is
# never merged automatically. "ai_dry_run" also covers the repair: the fix is tested and shown in the job
# summary, but nothing is updated, ticketed or opened.
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
#
# On day 1 (and when run by hand for all products) the screenshot inventory is rebuilt first
# (screenshot-inventory.yml), so the check compares against the lesson pages as published today. If the
# inventory scan fails, the check still runs on the previous inventory.
#
# Secrets: SUPABASE_SERVICE_ROLE_KEY, AUTH_STATE_JSON (auth/state.json of the test account),
# ANTHROPIC_API_KEY (the AI review is skipped without it).

name: Monthly screenshot check

on:
  schedule:
    - cron: "0 6 1-7 * *" # 06:00 UTC, days 1-7 of each month
  workflow_dispatch:
    inputs:
      product:
        description: "Product tag to run (e.g. admin), or all"
        required: true
        default: all
      update_baselines:
        description: "Save today's captures as the new baselines (commits them)"
        type: boolean
        default: false
      ai_dry_run:
        description: "AI review and script repair without updating Supabase, creating SHOT tickets or opening pull requests"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: screenshot-check
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.pick.outputs.product }}
      scan: ${{ steps.pick.outputs.scan }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          INPUT_PRODUCT: ${{ inputs.product }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            p="$INPUT_PRODUCT"
          else
            p=$(node -e 'console.log(require("./schedule.json").days[String(new Date().getUTCDate())] ?? "")')
          fi
          echo "product=$p" >> "$GITHUB_OUTPUT"
          echo "Product today: ${p:-nothing scheduled}"
          # Rebuild the screenshot inventory before the month's first check, or a manual run of all products
          scan=false
          if [ "$p" = "all" ] || { [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%-d)" = "1" ]; }; then scan=true; fi
          echo "scan=$scan" >> "$GITHUB_OUTPUT"
          echo "Rebuild screenshot inventory first: $scan"

  inventory:
    needs: pick
    if: needs.pick.outputs.scan == 'true'
    uses: ./.github/workflows/screenshot-inventory.yml
    secrets:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  check:
    needs: [pick, inventory]
    # Runs after the inventory scan, or without it when it was skipped or failed
    if: ${{ !cancelled() && needs.pick.outputs.product != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write # commits baselines (update_baselines) and pushes AI repair branches
      pull-requests: write # opens pull requests with AI script repairs (never merged automatically)
    env:
      PRODUCT: ${{ needs.pick.outputs.product }}
      UPDATE_BASELINES: ${{ inputs.update_baselines || false }}
      SUPABASE_URL: https://pduavmiyphkoekslpeld.supabase.co # project API address (not secret)
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Mac-like font rendering
        # Grayscale smoothing without hinting, as on macOS (see launchOptions in playwright.config.ts)
        run: |
          mkdir -p ~/.config/fontconfig
          cat > ~/.config/fontconfig/fonts.conf <<'XML'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <match target="font">
              <edit name="antialias" mode="assign"><bool>true</bool></edit>
              <edit name="hinting" mode="assign"><bool>false</bool></edit>
              <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
              <edit name="rgba" mode="assign"><const>none</const></edit>
              <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
            </match>
          </fontconfig>
          XML

      - name: Write sign-in session
        env:
          AUTH_STATE_JSON: ${{ secrets.AUTH_STATE_JSON }}
        run: |
          if [ -z "$AUTH_STATE_JSON" ]; then
            echo "::error::The AUTH_STATE_JSON secret is not set. Sign in with the test account (npm run login) and paste auth/state.json into the secret."
            exit 1
          fi
          mkdir -p auth
          printf '%s' "$AUTH_STATE_JSON" > auth/state.json

      - name: Run screenshots
        continue-on-error: true # failed checks are expected; the summary step decides
        run: |
          args=""
          [ "$PRODUCT" = "all" ] || args="--grep @$PRODUCT"
          if [ "$UPDATE_BASELINES" = "true" ]; then
            args="$args --update-snapshots"
            export RECORD_RUNS=false
          fi
          npx playwright test $args

      - name: AI review of flagged screenshots
        if: env.UPDATE_BASELINES != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_REVIEW_DRY_RUN: ${{ inputs.ai_dry_run || false }}
        run: node scripts/ai-review.mjs

      - name: AI repair of scripts that did not reach their screen
        if: ${{ !cancelled() && env.UPDATE_BASELINES != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_REVIEW_DRY_RUN: ${{ inputs.ai_dry_run || false }}
          AI_REPAIR_DRY_RUN: ${{ inputs.ai_dry_run || false }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ai-repair.mjs

      - name: Manual-capture tickets for screenshots that could not be captured
        if: ${{ !cancelled() && env.UPDATE_BASELINES != 'true' }}
        env:
          AI_REVIEW_DRY_RUN: ${{ inputs.ai_dry_run || false }}
        run: node scripts/manual-tickets.mjs

      - name: Summary
        if: always()
        run: node scripts/summary.mjs

      - name: Commit new baselines
        # Also after a failed summary: a screenshot that did not reach its screen writes no baseline, so one slow
        # page must not block saving all the others (run of 19 Nov 2026, AUC-412-3)
        if: ${{ !cancelled() && env.UPDATE_BASELINES == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baselines
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "Update baselines ($PRODUCT) from run ${{ github.run_id }}"
            git push
          fi
